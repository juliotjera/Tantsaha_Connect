# Application complète avec un vrai serveur PostgreSQL :
#   1. créer un fichier .env à côté de ce fichier : POSTGRES_PASSWORD=un-mot-de-passe-solide
#   2. docker compose up --build
#   3. ouvrir http://localhost:5000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tantsaha_connect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans le fichier .env}
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tantsaha_connect']
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - '5000:5000'
    environment:
      DB_MODE: postgres
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/tantsaha_connect
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  donnees:
